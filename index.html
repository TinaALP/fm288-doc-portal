<style>
/* ── tokens ─────────────────────────────────────────────── */
/* 固定淺色模式：不隨系統深色設定變化 */
:root{
  color-scheme:light;
  --paper:#FBFAF6; --raise:#F4F2EA; --ink:#17150E;
  --grey-1:#6B6759; --grey-2:#9C9789; --rule:#E2DDD0;
  --signal:#E8C400; --focus:#B89A00;
  --sans:"PingFang TC","Hiragino Sans","Noto Sans TC","Microsoft JhengHei",-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,"Cascadia Mono","Roboto Mono",monospace;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus); outline-offset:3px}

.shell{max-width:1180px; margin:0 auto; padding:0 24px 96px}

.masthead{
  display:flex; flex-wrap:wrap; align-items:flex-end; gap:24px 40px;
  padding:56px 0 24px; border-bottom:2px solid var(--ink);
}
.masthead h1{
  margin:0; font-size:clamp(1.75rem,3.6vw,2.6rem); font-weight:700;
  letter-spacing:-.02em; line-height:1.15; text-wrap:balance;
}
.masthead .en{
  display:block; margin-top:6px; font-family:var(--mono); font-size:.75rem;
  letter-spacing:.14em; text-transform:uppercase; color:var(--grey-1);
}
.stats{
  display:flex; gap:28px; margin-left:auto; font-family:var(--mono);
  font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; color:var(--grey-1);
}
.stats b{
  display:block; font-family:var(--sans); font-size:1.5rem; font-weight:700;
  letter-spacing:-.01em; color:var(--ink); font-variant-numeric:tabular-nums;
}

.notice{
  display:flex; gap:14px; align-items:flex-start; margin-top:28px; padding:16px 18px;
  background:var(--raise); border-left:4px solid var(--signal);
  font-size:.875rem; color:var(--grey-1);
}
.notice strong{color:var(--ink); font-weight:600}

.grid{display:grid; grid-template-columns:220px 1fr; gap:56px; margin-top:44px}

.rail{position:sticky; top:32px; align-self:start}
.rail .label{
  font-family:var(--mono); font-size:.68rem; letter-spacing:.14em;
  text-transform:uppercase; color:var(--grey-2);
  padding-bottom:10px; border-bottom:1px solid var(--rule);
}
.rail ol{list-style:none; margin:0; padding:8px 0 0}
.rail ol ol{padding:0 0 4px}
.rail a{
  display:grid; grid-template-columns:20px 1fr auto; gap:8px; align-items:baseline;
  padding:7px 0 7px 10px; margin-left:-14px; border-left:4px solid transparent;
  text-decoration:none; font-size:.875rem; color:var(--grey-1);
  transition:color .15s, border-color .15s;
}
.rail a.sub{font-size:.8125rem; padding:4px 0 4px 26px}
.rail a:hover{color:var(--ink)}
.rail a.on{color:var(--ink); border-left-color:var(--signal); font-weight:600}
.rail .code,.rail .n{font-family:var(--mono); font-size:.72rem; color:var(--grey-2)}
.rail a.on .code{color:var(--ink)}

.search{margin-bottom:36px}
.search input{
  width:100%; padding:12px 14px; font:inherit; font-size:.95rem;
  color:var(--ink); background:var(--raise); border:1px solid var(--rule); border-radius:0;
}
.search input::placeholder{color:var(--grey-2)}
.search input:focus{outline:none; border-color:var(--focus); box-shadow:inset 0 -2px 0 var(--signal)}
.search .hint{
  margin-top:8px; font-family:var(--mono); font-size:.7rem;
  letter-spacing:.06em; color:var(--grey-2);
}

.sec{border-bottom:1px solid var(--rule); scroll-margin-top:16px}
.sec > summary{
  display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
  padding:16px 0; cursor:pointer; list-style:none;
  font-size:1.0625rem; font-weight:700; letter-spacing:-.01em;
}
.sec > summary::-webkit-details-marker{display:none}
.sec > summary:hover .stitle{box-shadow:inset 0 -2px 0 var(--signal)}
.sec > summary .chev{
  font-family:var(--mono); font-size:.7rem; font-weight:400; color:var(--grey-2);
  display:inline-block; transition:transform .15s;
}
.sec[open] > summary .chev{transform:rotate(90deg)}
.sec > summary .code{
  font-family:var(--mono); font-size:.7rem; font-weight:400; letter-spacing:.1em;
  color:var(--ink); background:var(--signal); padding:3px 8px;
}
.sec > summary .en{
  font-family:var(--mono); font-size:.68rem; font-weight:400;
  letter-spacing:.1em; text-transform:uppercase; color:var(--grey-2);
}
.sec > summary .cnt{
  margin-left:auto; font-family:var(--mono); font-size:.72rem; font-weight:400;
  color:var(--grey-2); font-variant-numeric:tabular-nums; white-space:nowrap;
}
.secbody{padding-bottom:34px}
.sec .blurb{margin:0 0 14px; font-size:.85rem; color:var(--grey-1); max-width:62ch}

.tools{display:flex; gap:10px; margin-top:14px}
.tools button{
  display:inline-flex; align-items:center; gap:7px;
  font:inherit; font-size:.875rem; font-weight:600; color:var(--ink);
  background:var(--raise); border:1.5px solid var(--ink);
  padding:9px 16px; cursor:pointer;
  transition:background .12s, color .12s;
}
.tools button .ic{font-size:.75rem; line-height:1}
.tools button:hover{background:var(--signal); border-color:var(--ink)}
.tools button:active{transform:translateY(1px)}

.grp{margin-top:26px; scroll-margin-top:24px}
.grp > h3{
  display:flex; align-items:baseline; gap:10px; margin:0 0 6px;
  font-size:.9375rem; font-weight:600; letter-spacing:-.005em;
}
.grp > h3 .code{
  font-family:var(--mono); font-size:.7rem; font-weight:400; color:var(--grey-1);
  border:1px solid var(--rule); padding:1px 6px;
}

.rows{border-top:1px solid var(--rule)}
.row{
  display:grid; grid-template-columns:1fr 78px 96px; gap:8px 20px; align-items:baseline;
  padding:14px 0; border-bottom:1px solid var(--rule); text-decoration:none;
}
a.row:hover{background:var(--raise)}
a.row:hover .t{box-shadow:inset 0 -2px 0 var(--signal)}
.row .t{font-size:.9375rem; font-weight:600; line-height:1.45; word-break:break-word}
.row .d{grid-column:1; font-size:.8125rem; color:var(--grey-1); margin-top:2px; max-width:70ch}
.row .fmt,.row .up{
  font-family:var(--mono); font-size:.7rem; letter-spacing:.06em;
  color:var(--grey-1); font-variant-numeric:tabular-nums; white-space:nowrap;
}
.row .fmt{text-transform:uppercase}
.row .up{text-align:right}
.row.pending{opacity:.55}
.row.pending .up{color:var(--grey-2)}
.pill{
  display:inline-block; margin-left:8px; padding:2px 6px;
  font-family:var(--mono); font-size:.62rem; letter-spacing:.08em;
  text-transform:uppercase; color:var(--grey-1);
  border:1px solid var(--rule); vertical-align:1px;
}
.empty{padding:40px 0; color:var(--grey-1); font-size:.9rem}

footer{
  margin-top:64px; padding-top:20px; border-top:1px solid var(--rule);
  font-family:var(--mono); font-size:.7rem; letter-spacing:.06em;
  color:var(--grey-2); display:flex; flex-wrap:wrap; gap:6px 24px;
}

@media (max-width:860px){
  .grid{grid-template-columns:1fr; gap:32px}
  .rail{position:static}
  .rail > ol{display:flex; flex-wrap:wrap; gap:4px 16px}
  .rail ol ol{display:none}
  .rail a{border-left:none; border-bottom:3px solid transparent; margin-left:0; padding:6px 0}
  .rail a.on{border-bottom-color:var(--signal)}
  .row{grid-template-columns:1fr auto}
  .row .up{grid-column:2}
  .row .fmt{grid-column:1; grid-row:3}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>

function blocksOf(sec){
  return sec.groups
    ? sec.groups.map(g => ({ sec, grp:g, docs:g.docs }))
    : [{ sec, grp:null, docs:sec.docs }];
}
const allDocs = SECTIONS.flatMap(blocksOf).flatMap(b => b.docs);
const pending = allDocs.filter(d => !d.url).length;
const dates   = allDocs.map(d => d.up).filter(u => /^\d{4}-\d{2}-\d{2}$/.test(u)).sort();
const latest  = dates.length ? dates[dates.length - 1] : null;

document.getElementById('stat-total').textContent = allDocs.length;
document.getElementById('stat-cat').textContent   = SECTIONS.length;
document.getElementById('stat-date').textContent  = latest ? latest.slice(5).replace('-','/') : '—';
document.getElementById('foot-pending').textContent =
  pending ? `${pending} / ${allDocs.length} 筆尚待補上 OneDrive 連結` : `全部 ${allDocs.length} 筆連結已就緒`;

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function secId(sec){ return `sec-${sec.code}`; }
function grpId(sec,grp){ return `sec-${sec.code}${grp.code}`; }

/* ── rail ───────────────────────────────────────────────── */
railEl.innerHTML = SECTIONS.map(sec => {
  const n = sec.groups ? sec.groups.reduce((a,g) => a + g.docs.length, 0) : sec.docs.length;
  const subs = sec.groups ? `<ol>${sec.groups.map(g => `
    <li><a class="sub" href="#${grpId(sec,g)}" data-id="${grpId(sec,g)}">
      <span class="code">${g.code}</span><span>${esc(g.zh)}</span><span class="n">${g.docs.length}</span>
    </a></li>`).join('')}</ol>` : '';
  return `<li>
    <a href="#${secId(sec)}" data-id="${secId(sec)}">
      <span class="code">${sec.code}</span><span>${esc(sec.zh)}</span><span class="n">${n}</span>
    </a>${subs}</li>`;
}).join('');

/* ── rows ───────────────────────────────────────────────── */
function rowHTML(d){
  const inner = `
    <span class="t">${esc(d.t)}${d.url ? '' : '<span class="pill">待補連結</span>'}</span>
    <span class="fmt">${esc(d.fmt)}</span>
    <span class="up">${esc(d.up)}</span>
    <span class="d">${esc(d.d)}</span>`;
  return d.url
    ? `<a class="row" href="${esc(d.url)}" target="_blank" rel="noopener">${inner}</a>`
    : `<div class="row pending">${inner}</div>`;
}

/* 哪些分類目前是展開的（搜尋時一律全開） */
const openCodes = new Set(SECTIONS.filter(s => s.open).map(s => s.code));

function render(term){
  const t = term.trim().toLowerCase();
  const match = (d, sec, grp) =>
    (d.t + d.d + d.fmt + sec.zh + (sec.en || '') + (grp ? grp.zh : '')).toLowerCase().includes(t);

  let shown = 0;
  const html = SECTIONS.map(sec => {
    const blocks = blocksOf(sec)
      .map(b => ({ sec:b.sec, grp:b.grp, docs: t ? b.docs.filter(d => match(d, sec, b.grp)) : b.docs }))
      .filter(b => b.docs.length);
    if (!blocks.length) return '';
    const n = blocks.reduce((a,b) => a + b.docs.length, 0);
    shown += n;

    const body = blocks.map(b => b.grp
      ? `<div class="grp" id="${grpId(sec,b.grp)}">
           <h3><span class="code">${b.grp.code}</span>${esc(b.grp.zh)}</h3>
           <div class="rows">${b.docs.map(rowHTML).join('')}</div>
         </div>`
      : `<div class="rows">${b.docs.map(rowHTML).join('')}</div>`
    ).join('');

    const pend = blocks.reduce((a,b) => a + b.docs.filter(d => !d.url).length, 0);
    const open = t ? true : openCodes.has(sec.code);

    return `<details class="sec" id="${secId(sec)}"${open ? ' open' : ''}>
      <summary>
        <span class="chev" aria-hidden="true">▸</span>
        <span class="code">${sec.code}</span>
        <span class="stitle">${esc(sec.zh)}</span>
        ${sec.en ? `<span class="en">${esc(sec.en)}</span>` : ''}
        <span class="cnt">${n} 筆${pend ? `・${pend} 待補` : ''}</span>
      </summary>
      <div class="secbody">
        ${t ? '' : `<p class="blurb">${esc(sec.blurb)}</p>`}
        ${body}
      </div>
    </details>`;
  }).join('');

  listEl.innerHTML = html ||
    `<p class="empty">找不到符合「${esc(term)}」的文件。試試「SOP」、「棧板」、「UAT」或「進貨」。</p>`;
  hintEl.textContent = t ? `符合 ${shown} 筆` : `共 ${allDocs.length} 筆，分 ${SECTIONS.length} 類`;

  /* 記住使用者手動展開／收合的狀態（搜尋中不記錄） */
  listEl.querySelectorAll('details.sec').forEach(d => {
    d.addEventListener('toggle', () => {
      if (qEl.value.trim()) return;
      const code = d.id.slice(4);
      d.open ? openCodes.add(code) : openCodes.delete(code);
    });
  });
}

qEl.addEventListener('input', e => render(e.target.value));
document.getElementById('expand-all').addEventListener('click', () => {
  SECTIONS.forEach(s => openCodes.add(s.code)); render(qEl.value);
});
document.getElementById('collapse-all').addEventListener('click', () => {
  openCodes.clear(); render(qEl.value);
});
render('');

/* ── 側欄點擊：先展開該分類再捲動 ────────────────────────── */
const smooth = !matchMedia('(prefers-reduced-motion: reduce)').matches;
railEl.addEventListener('click', e => {
  const a = e.target.closest('a');
  if (!a) return;
  e.preventDefault();
  const id = a.dataset.id;
  openCodes.add(id.slice(4, 5));
  render(qEl.value);
  const target = document.getElementById(id);
  if (target) target.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block:'start' });
});

/* ── rail active state ──────────────────────────────────── */
const links = [...railEl.querySelectorAll('a')];
const spy = new IntersectionObserver(entries => {
  entries.forEach(en => {
    if (!en.isIntersecting) return;
    links.forEach(l => l.classList.toggle('on', l.dataset.id === en.target.id));
  });
}, { rootMargin:'-10% 0px -75% 0px' });

function observe(){ document.querySelectorAll('.sec, .grp').forEach(el => spy.observe(el)); }
observe();
new MutationObserver(observe).observe(listEl, { childList:true });
</script>
</body>
</html>
